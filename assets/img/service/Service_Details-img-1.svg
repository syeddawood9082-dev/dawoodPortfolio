<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" fill="none">
  <defs>
    <linearGradient id="sd1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c15"/>
      <stop offset="100%" stop-color="#161628"/>
    </linearGradient>
    <linearGradient id="sd1-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="30%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="800" fill="url(#sd1-bg)"/>

  <!-- Grid underlay at 2% opacity -->
  <g opacity="0.02" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="160" x2="1920" y2="160"/>
    <line x1="0" y1="320" x2="1920" y2="320"/>
    <line x1="0" y1="480" x2="1920" y2="480"/>
    <line x1="0" y1="640" x2="1920" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="1280" y1="0" x2="1280" y2="800"/>
    <line x1="1600" y1="0" x2="1600" y2="800"/>
  </g>

  <!-- === LEFT THIRD: Brain-like dot cluster === -->
  <g transform="translate(350, 400)" opacity="0.12">
    <!-- Organic cluster of dots forming brain-like shape -->
    <!-- Left hemisphere -->
    <circle cx="-60" cy="-40" r="3" fill="#8b5cf6"/>
    <circle cx="-50" cy="-55" r="2.5" fill="#8b5cf6"/>
    <circle cx="-40" cy="-65" r="2" fill="#a78bfa"/>
    <circle cx="-70" cy="-25" r="2.5" fill="#7c3aed"/>
    <circle cx="-75" cy="-10" r="3" fill="#8b5cf6"/>
    <circle cx="-70" cy="5" r="2" fill="#a78bfa"/>
    <circle cx="-65" cy="20" r="2.5" fill="#8b5cf6"/>
    <circle cx="-55" cy="35" r="3" fill="#7c3aed"/>
    <circle cx="-45" cy="45" r="2" fill="#8b5cf6"/>
    <circle cx="-35" cy="50" r="2.5" fill="#a78bfa"/>
    <circle cx="-80" cy="-35" r="2" fill="#7c3aed"/>
    <circle cx="-85" cy="-15" r="1.5" fill="#8b5cf6"/>
    <!-- Right hemisphere -->
    <circle cx="-25" cy="-70" r="2.5" fill="#8b5cf6"/>
    <circle cx="-10" cy="-72" r="2" fill="#a78bfa"/>
    <circle cx="5" cy="-68" r="3" fill="#8b5cf6"/>
    <circle cx="20" cy="-60" r="2.5" fill="#7c3aed"/>
    <circle cx="30" cy="-48" r="2" fill="#8b5cf6"/>
    <circle cx="38" cy="-35" r="3" fill="#a78bfa"/>
    <circle cx="42" cy="-18" r="2.5" fill="#8b5cf6"/>
    <circle cx="40" cy="0" r="2" fill="#7c3aed"/>
    <circle cx="35" cy="15" r="3" fill="#8b5cf6"/>
    <circle cx="25" cy="30" r="2.5" fill="#a78bfa"/>
    <circle cx="10" cy="42" r="2" fill="#8b5cf6"/>
    <circle cx="-5" cy="48" r="3" fill="#7c3aed"/>
    <circle cx="-20" cy="50" r="2" fill="#8b5cf6"/>
    <!-- Center line / corpus callosum -->
    <circle cx="-15" cy="-30" r="1.5" fill="#a78bfa"/>
    <circle cx="-12" cy="-15" r="1.5" fill="#8b5cf6"/>
    <circle cx="-10" cy="0" r="1.5" fill="#a78bfa"/>
    <circle cx="-12" cy="15" r="1.5" fill="#7c3aed"/>
    <circle cx="-15" cy="30" r="1.5" fill="#8b5cf6"/>
    <!-- Inner dots -->
    <circle cx="-40" cy="-20" r="1.5" fill="#a78bfa"/>
    <circle cx="-35" cy="0" r="2" fill="#8b5cf6"/>
    <circle cx="-30" cy="20" r="1.5" fill="#7c3aed"/>
    <circle cx="10" cy="-25" r="1.5" fill="#a78bfa"/>
    <circle cx="15" cy="-8" r="2" fill="#8b5cf6"/>
    <circle cx="12" cy="10" r="1.5" fill="#7c3aed"/>
    <!-- Connecting lines within cluster -->
    <line x1="-60" y1="-40" x2="-50" y2="-55" stroke="#8b5cf6" stroke-width="0.5" opacity="0.5"/>
    <line x1="-50" y1="-55" x2="-40" y2="-65" stroke="#8b5cf6" stroke-width="0.5" opacity="0.4"/>
    <line x1="-75" y1="-10" x2="-65" y2="20" stroke="#7c3aed" stroke-width="0.5" opacity="0.4"/>
    <line x1="-35" y1="0" x2="-12" y2="-15" stroke="#a78bfa" stroke-width="0.5" opacity="0.3"/>
    <line x1="-10" y1="0" x2="15" y2="-8" stroke="#8b5cf6" stroke-width="0.5" opacity="0.4"/>
    <line x1="20" y1="-60" x2="38" y2="-35" stroke="#7c3aed" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- === CENTER: Flowing gradient lines connecting left to right === -->
  <g>
    <!-- Main flow lines -->
    <path d="M480,350 C600,320 750,380 960,400 C1170,420 1300,360 1440,380"
          stroke="url(#sd1-flow)" stroke-width="1.5" fill="none"/>
    <path d="M450,400 C580,430 720,370 960,390 C1200,410 1320,440 1470,420"
          stroke="url(#sd1-flow)" stroke-width="1" fill="none" opacity="0.7"/>
    <path d="M500,420 C630,390 780,440 960,430 C1140,420 1280,390 1420,410"
          stroke="url(#sd1-flow)" stroke-width="0.8" fill="none" opacity="0.5"/>
    <path d="M460,380 C610,360 800,400 960,395 C1120,390 1350,420 1450,400"
          stroke="url(#sd1-flow)" stroke-width="0.6" fill="none" opacity="0.4"/>

    <!-- Data particles along flow -->
    <circle cx="550" cy="368" r="2" fill="#8b5cf6" opacity="0.10"/>
    <circle cx="700" cy="385" r="1.5" fill="#7c3aed" opacity="0.08"/>
    <circle cx="850" cy="395" r="2" fill="#06b6d4" opacity="0.08"/>
    <circle cx="960" cy="398" r="2.5" fill="#06b6d4" opacity="0.10"/>
    <circle cx="1100" cy="405" r="2" fill="#06b6d4" opacity="0.08"/>
    <circle cx="1250" cy="390" r="1.5" fill="#10b981" opacity="0.08"/>
    <circle cx="1380" cy="395" r="2" fill="#10b981" opacity="0.10"/>
  </g>

  <!-- === RIGHT THIRD: Structured grid of small squares === -->
  <g transform="translate(1520, 340)" opacity="0.10">
    <!-- 6x5 grid of small squares suggesting organized output -->
    <rect x="0" y="0" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="none"/>
    <rect x="18" y="0" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="none"/>
    <rect x="36" y="0" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="none"/>
    <rect x="54" y="0" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="none"/>
    <rect x="72" y="0" width="10" height="10" rx="1" stroke="#06b6d4" stroke-width="0.8" fill="none"/>
    <rect x="90" y="0" width="10" height="10" rx="1" stroke="#06b6d4" stroke-width="0.8" fill="none"/>

    <rect x="0" y="18" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="none"/>
    <rect x="18" y="18" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="#10b981" fill-opacity="0.15"/>
    <rect x="36" y="18" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="none"/>
    <rect x="54" y="18" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="#10b981" fill-opacity="0.10"/>
    <rect x="72" y="18" width="10" height="10" rx="1" stroke="#06b6d4" stroke-width="0.8" fill="none"/>
    <rect x="90" y="18" width="10" height="10" rx="1" stroke="#06b6d4" stroke-width="0.8" fill="none"/>

    <rect x="0" y="36" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="none"/>
    <rect x="18" y="36" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="none"/>
    <rect x="36" y="36" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="#10b981" fill-opacity="0.12"/>
    <rect x="54" y="36" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="none"/>
    <rect x="72" y="36" width="10" height="10" rx="1" stroke="#06b6d4" stroke-width="0.8" fill="#06b6d4" fill-opacity="0.10"/>
    <rect x="90" y="36" width="10" height="10" rx="1" stroke="#06b6d4" stroke-width="0.8" fill="none"/>

    <rect x="0" y="54" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="#10b981" fill-opacity="0.08"/>
    <rect x="18" y="54" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="none"/>
    <rect x="36" y="54" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="none"/>
    <rect x="54" y="54" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="#10b981" fill-opacity="0.15"/>
    <rect x="72" y="54" width="10" height="10" rx="1" stroke="#06b6d4" stroke-width="0.8" fill="none"/>
    <rect x="90" y="54" width="10" height="10" rx="1" stroke="#06b6d4" stroke-width="0.8" fill="#06b6d4" fill-opacity="0.08"/>

    <rect x="0" y="72" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="none"/>
    <rect x="18" y="72" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="none"/>
    <rect x="36" y="72" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="none"/>
    <rect x="54" y="72" width="10" height="10" rx="1" stroke="#10b981" stroke-width="0.8" fill="none"/>
    <rect x="72" y="72" width="10" height="10" rx="1" stroke="#06b6d4" stroke-width="0.8" fill="none"/>
    <rect x="90" y="72" width="10" height="10" rx="1" stroke="#06b6d4" stroke-width="0.8" fill="none"/>
  </g>
</svg>