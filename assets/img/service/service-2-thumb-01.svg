<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280">
  <defs>
    <radialGradient id="glow01" cx="50%" cy="50%" r="35%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="520" height="280" rx="8" fill="#18181b"/>

  <!-- Subtle radial glow behind icon -->
  <circle cx="260" cy="140" r="80" fill="url(#glow01)"/>

  <!-- Brain icon - two curved paths forming a minimal brain silhouette -->
  <g transform="translate(260, 140)" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left hemisphere -->
    <path d="M0,-20 C-12,-20 -20,-14 -20,-4 C-20,2 -16,6 -14,8 C-16,10 -18,14 -14,18 C-10,22 -4,20 0,18"/>
    <path d="M0,-20 C-6,-20 -14,-16 -14,-8 C-14,-2 -10,2 -8,4"/>
    <!-- Right hemisphere -->
    <path d="M0,-20 C12,-20 20,-14 20,-4 C20,2 16,6 14,8 C16,10 18,14 14,18 C10,22 4,20 0,18"/>
    <path d="M0,-20 C6,-20 14,-16 14,-8 C14,-2 10,2 8,4"/>
    <!-- Center division -->
    <line x1="0" y1="-20" x2="0" y2="18"/>
  </g>
</svg>
