<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 945 980" fill="none">
  <defs>
    <linearGradient id="a1-bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#0f0f18"/>
      <stop offset="100%" stop-color="#1a1a30"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="945" height="980" fill="url(#a1-bg)"/>

  <!-- Subtle orbital rings at 4% opacity -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5" fill="none">
    <ellipse cx="472.5" cy="490" rx="280" ry="380" transform="rotate(8, 472.5, 490)"/>
    <ellipse cx="472.5" cy="490" rx="240" ry="340" transform="rotate(-5, 472.5, 490)"/>
    <ellipse cx="472.5" cy="490" rx="200" ry="300" transform="rotate(12, 472.5, 490)"/>
    <ellipse cx="472.5" cy="490" rx="320" ry="420" transform="rotate(-3, 472.5, 490)"/>
  </g>

  <!-- Flowing vertical curve connecting all 4 nodes -->
  <path d="M472.5,200 C520,300 425,380 472.5,420 C520,460 425,560 472.5,600 C520,640 425,720 472.5,780"
        stroke="rgba(255,255,255,0.10)" stroke-width="1" fill="none"/>
  <!-- Secondary flowing curve -->
  <path d="M472.5,200 C425,300 520,380 472.5,420 C425,460 520,560 472.5,600 C425,640 520,720 472.5,780"
        stroke="rgba(255,255,255,0.06)" stroke-width="0.8" fill="none"/>

  <!-- === STAGE 1: Circle with dot (Research) - Violet === -->
  <g transform="translate(472.5, 250)">
    <!-- Horizontal line segment -->
    <line x1="-80" y1="0" x2="-20" y2="0" stroke="#8b5cf6" stroke-width="0.8" opacity="0.20"/>
    <line x1="20" y1="0" x2="80" y2="0" stroke="#8b5cf6" stroke-width="0.8" opacity="0.20"/>
    <!-- Dot node -->
    <circle cx="0" cy="0" r="6" fill="#8b5cf6" opacity="0.15"/>
    <circle cx="0" cy="0" r="3" fill="#8b5cf6" opacity="0.25"/>
    <!-- Icon: Circle with dot (research/lens) -->
    <circle cx="0" cy="0" r="15" stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.6"/>
    <circle cx="0" cy="0" r="4" stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.4"/>
    <!-- Subtle glow -->
    <circle cx="0" cy="0" r="30" fill="#8b5cf6" opacity="0.03"/>
  </g>

  <!-- === STAGE 2: Triangle (Design) - Cyan === -->
  <g transform="translate(472.5, 420)">
    <!-- Horizontal line segment -->
    <line x1="-80" y1="0" x2="-20" y2="0" stroke="#06b6d4" stroke-width="0.8" opacity="0.20"/>
    <line x1="20" y1="0" x2="80" y2="0" stroke="#06b6d4" stroke-width="0.8" opacity="0.20"/>
    <!-- Dot node -->
    <circle cx="0" cy="0" r="6" fill="#06b6d4" opacity="0.15"/>
    <circle cx="0" cy="0" r="3" fill="#06b6d4" opacity="0.25"/>
    <!-- Icon: Triangle (design) -->
    <polygon points="0,-15 13,10 -13,10" stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.6" stroke-linejoin="round"/>
    <!-- Subtle glow -->
    <circle cx="0" cy="0" r="30" fill="#06b6d4" opacity="0.03"/>
  </g>

  <!-- === STAGE 3: Square (Build) - Violet === -->
  <g transform="translate(472.5, 600)">
    <!-- Horizontal line segment -->
    <line x1="-80" y1="0" x2="-20" y2="0" stroke="#8b5cf6" stroke-width="0.8" opacity="0.20"/>
    <line x1="20" y1="0" x2="80" y2="0" stroke="#8b5cf6" stroke-width="0.8" opacity="0.20"/>
    <!-- Dot node -->
    <circle cx="0" cy="0" r="6" fill="#8b5cf6" opacity="0.15"/>
    <circle cx="0" cy="0" r="3" fill="#8b5cf6" opacity="0.25"/>
    <!-- Icon: Square (build) -->
    <rect x="-12" y="-12" width="24" height="24" stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.6" rx="2"/>
    <!-- Subtle glow -->
    <circle cx="0" cy="0" r="30" fill="#8b5cf6" opacity="0.03"/>
  </g>

  <!-- === STAGE 4: Diamond (Deploy) - Cyan === -->
  <g transform="translate(472.5, 770)">
    <!-- Horizontal line segment -->
    <line x1="-80" y1="0" x2="-20" y2="0" stroke="#06b6d4" stroke-width="0.8" opacity="0.20"/>
    <line x1="20" y1="0" x2="80" y2="0" stroke="#06b6d4" stroke-width="0.8" opacity="0.20"/>
    <!-- Dot node -->
    <circle cx="0" cy="0" r="6" fill="#06b6d4" opacity="0.15"/>
    <circle cx="0" cy="0" r="3" fill="#06b6d4" opacity="0.25"/>
    <!-- Icon: Diamond (deploy) -->
    <polygon points="0,-14 14,0 0,14 -14,0" stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.6" stroke-linejoin="round"/>
    <!-- Subtle glow -->
    <circle cx="0" cy="0" r="30" fill="#06b6d4" opacity="0.03"/>
  </g>

  <!-- Small decorative dots along connections -->
  <circle cx="460" cy="310" r="1.2" fill="white" opacity="0.08"/>
  <circle cx="480" cy="340" r="1" fill="white" opacity="0.06"/>
  <circle cx="465" cy="370" r="1.5" fill="white" opacity="0.08"/>
  <circle cx="478" cy="470" r="1.2" fill="white" opacity="0.06"/>
  <circle cx="462" cy="510" r="1" fill="white" opacity="0.08"/>
  <circle cx="485" cy="540" r="1.5" fill="white" opacity="0.06"/>
  <circle cx="468" cy="650" r="1.2" fill="white" opacity="0.08"/>
  <circle cx="482" cy="690" r="1" fill="white" opacity="0.06"/>
  <circle cx="460" cy="730" r="1.5" fill="white" opacity="0.08"/>
</svg>