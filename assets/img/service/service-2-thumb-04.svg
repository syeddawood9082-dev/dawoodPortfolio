<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280">
  <defs>
    <radialGradient id="glow04" cx="50%" cy="50%" r="35%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="520" height="280" rx="8" fill="#18181b"/>

  <!-- Subtle radial glow behind icon -->
  <circle cx="260" cy="140" r="80" fill="url(#glow04)"/>

  <!-- Angle brackets </> icon -->
  <g transform="translate(260, 140)" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left angle bracket < -->
    <polyline points="-8,-16 -22,0 -8,16"/>
    <!-- Right angle bracket > -->
    <polyline points="8,-16 22,0 8,16"/>
    <!-- Forward slash / -->
    <line x1="5" y1="-20" x2="-5" y2="20"/>
  </g>
</svg>
