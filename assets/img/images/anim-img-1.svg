<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base gradient mesh -->
    <linearGradient id="a1-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="35%" stop-color="#12102e"/>
      <stop offset="65%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#141420"/>
    </linearGradient>
    <!-- Secondary gradient overlay -->
    <linearGradient id="a1-overlay" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1832" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0f0e1f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Organic blob gradients -->
    <radialGradient id="a1-blob1" cx="25%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="40%" stop-color="#6d28d9" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a1-blob2" cx="75%" cy="60%" r="30%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.07"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a1-blob3" cx="50%" cy="30%" r="25%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a1-blob4" cx="15%" cy="70%" r="28%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a1-blob5" cx="85%" cy="25%" r="22%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <!-- Central luminous glow -->
    <radialGradient id="a1-glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="30%" stop-color="#6d28d9" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#5b21b6" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <!-- Noise-like texture filter -->
    <filter id="a1-noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feComponentTransfer in="grayNoise" result="faintNoise">
        <feFuncA type="linear" slope="0.015"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faintNoise" mode="screen"/>
    </filter>
  </defs>

  <!-- Base fill -->
  <rect width="1920" height="800" fill="url(#a1-base)"/>
  <!-- Secondary gradient layer -->
  <rect width="1920" height="800" fill="url(#a1-overlay)"/>

  <!-- Large organic blob shapes -->
  <ellipse cx="480" cy="280" rx="680" ry="350" fill="url(#a1-blob1)"/>
  <ellipse cx="1440" cy="480" rx="580" ry="320" fill="url(#a1-blob2)"/>
  <ellipse cx="960" cy="240" rx="500" ry="280" fill="url(#a1-blob3)"/>
  <ellipse cx="280" cy="560" rx="540" ry="300" fill="url(#a1-blob4)"/>
  <ellipse cx="1640" cy="200" rx="420" ry="250" fill="url(#a1-blob5)"/>

  <!-- Organic flowing blobs with irregular paths -->
  <path d="M200,400 C350,200 550,350 700,300 C850,250 950,150 1100,250 C1250,350 1350,200 1500,350 C1650,500 1750,300 1920,400" stroke="#8b5cf6" stroke-opacity="0.03" stroke-width="1.5" fill="none"/>
  <path d="M0,500 C200,350 400,550 650,450 C900,350 1050,500 1250,400 C1450,300 1600,450 1920,350" stroke="#a78bfa" stroke-opacity="0.03" stroke-width="1" fill="none"/>
  <path d="M0,300 C150,450 350,250 550,350 C750,450 900,300 1100,380 C1300,460 1500,280 1700,400 C1800,460 1860,380 1920,350" stroke="#6d28d9" stroke-opacity="0.025" stroke-width="1" fill="none"/>

  <!-- Subtle diagonal lines creating movement -->
  <line x1="0" y1="800" x2="960" y2="0" stroke="#a78bfa" stroke-opacity="0.025" stroke-width="0.8"/>
  <line x1="200" y1="800" x2="1160" y2="0" stroke="#8b5cf6" stroke-opacity="0.02" stroke-width="0.6"/>
  <line x1="500" y1="800" x2="1460" y2="0" stroke="#7c3aed" stroke-opacity="0.03" stroke-width="0.7"/>
  <line x1="760" y1="800" x2="1720" y2="0" stroke="#6d28d9" stroke-opacity="0.02" stroke-width="0.5"/>
  <line x1="1000" y1="800" x2="1920" y2="100" stroke="#a78bfa" stroke-opacity="0.015" stroke-width="0.6"/>

  <!-- More flowing curves for depth -->
  <path d="M0,600 Q480,400 960,550 Q1440,700 1920,500" stroke="#c4b5fd" stroke-opacity="0.02" stroke-width="0.8" fill="none"/>
  <path d="M0,200 Q480,350 960,250 Q1440,150 1920,300" stroke="#818cf8" stroke-opacity="0.02" stroke-width="0.7" fill="none"/>

  <!-- Central luminous glow -->
  <rect width="1920" height="800" fill="url(#a1-glow)"/>

  <!-- Very subtle noise texture layer -->
  <rect width="1920" height="800" fill="transparent" filter="url(#a1-noise)" opacity="0.4"/>
</svg>