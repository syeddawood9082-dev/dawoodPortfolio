<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 370" fill="none">
  <defs>
    <linearGradient id="c1-bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#15151e"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="c1-ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="370" fill="url(#c1-bg)"/>

  <!-- Vertical flowing gradient ribbon -->
  <path d="M120,0 C140,60 90,120 110,185 C130,250 80,310 100,370" stroke="url(#c1-ribbon)" stroke-width="40" fill="none" stroke-linecap="round"/>

  <!-- Secondary thinner ribbon -->
  <path d="M180,0 C200,80 160,150 175,220 C190,290 155,340 170,370" stroke="#7c3aed" stroke-width="12" fill="none" opacity="0.08" stroke-linecap="round"/>

  <!-- Scattered particles -->
  <circle cx="80" cy="90" r="3" fill="#7c3aed" opacity="0.12"/>
  <circle cx="220" cy="150" r="4" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="60" cy="260" r="3.5" fill="#7c3aed" opacity="0.10"/>
  <circle cx="250" cy="80" r="2.5" fill="#8b5cf6" opacity="0.07"/>
  <circle cx="200" cy="300" r="5" fill="#7c3aed" opacity="0.06"/>
  <circle cx="40" cy="180" r="2" fill="#8b5cf6" opacity="0.09"/>
  <circle cx="270" cy="230" r="3" fill="#7c3aed" opacity="0.08"/>
</svg>