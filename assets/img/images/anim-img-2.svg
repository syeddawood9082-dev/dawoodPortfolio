<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base gradient: dark teal to dark slate -->
    <linearGradient id="a2-base" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="40%" stop-color="#0c1a30"/>
      <stop offset="70%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Secondary wash -->
    <linearGradient id="a2-wash" x1="1" y1="0" x2="0" y2="0.8">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#0b1525" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Off-center cyan glow (right side) -->
    <radialGradient id="a2-cyan" cx="72%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.06"/>
      <stop offset="25%" stop-color="#0891b2" stop-opacity="0.04"/>
      <stop offset="55%" stop-color="#0e7490" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <!-- Secondary emerald glow (left side) -->
    <radialGradient id="a2-emerald" cx="22%" cy="55%" r="30%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.04"/>
      <stop offset="35%" stop-color="#059669" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <!-- Softer tertiary glow -->
    <radialGradient id="a2-glow3" cx="50%" cy="35%" r="28%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <!-- Bottom atmosphere -->
    <radialGradient id="a2-bottom" cx="40%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <!-- Dot pattern -->
    <pattern id="a2-dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.6" fill="#94a3b8" fill-opacity="0.02"/>
    </pattern>
    <!-- Diagonal hatching texture -->
    <pattern id="a2-hatch" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#64748b" stroke-width="0.3" stroke-opacity="0.02"/>
    </pattern>
    <!-- Noise filter for texture -->
    <filter id="a2-noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feComponentTransfer in="gray" result="faint">
        <feFuncA type="linear" slope="0.012"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="screen"/>
    </filter>
  </defs>

  <!-- Base fill -->
  <rect width="1920" height="800" fill="url(#a2-base)"/>
  <rect width="1920" height="800" fill="url(#a2-wash)"/>

  <!-- Large organic ambient shapes -->
  <ellipse cx="1380" cy="360" rx="650" ry="380" fill="url(#a2-cyan)"/>
  <ellipse cx="420" cy="440" rx="580" ry="340" fill="url(#a2-emerald)"/>
  <ellipse cx="960" cy="280" rx="540" ry="300" fill="url(#a2-glow3)"/>
  <ellipse cx="760" cy="680" rx="700" ry="300" fill="url(#a2-bottom)"/>

  <!-- Flowing organic curves -->
  <path d="M0,350 C320,200 640,400 960,300 C1280,200 1440,380 1920,280" stroke="#06b6d4" stroke-opacity="0.025" stroke-width="1.2" fill="none"/>
  <path d="M0,450 C250,550 500,380 750,480 C1000,580 1250,400 1500,500 C1750,600 1850,450 1920,480" stroke="#10b981" stroke-opacity="0.02" stroke-width="1" fill="none"/>
  <path d="M0,250 C400,180 700,320 1000,220 C1300,120 1600,280 1920,200" stroke="#22d3ee" stroke-opacity="0.02" stroke-width="0.8" fill="none"/>
  <path d="M0,600 C300,500 600,650 900,550 C1200,450 1500,600 1920,520" stroke="#2dd4bf" stroke-opacity="0.015" stroke-width="0.7" fill="none"/>

  <!-- Subtle diagonal flowing lines -->
  <path d="M-100,800 Q400,400 960,500 Q1520,600 2020,200" stroke="#67e8f9" stroke-opacity="0.015" stroke-width="0.6" fill="none"/>
  <path d="M-50,700 Q500,300 1000,450 Q1500,600 1970,150" stroke="#a7f3d0" stroke-opacity="0.012" stroke-width="0.5" fill="none"/>

  <!-- Dot grid texture -->
  <rect width="1920" height="800" fill="url(#a2-dots)"/>
  <!-- Diagonal hatching -->
  <rect width="1920" height="800" fill="url(#a2-hatch)"/>

  <!-- Very faint large circular rings for depth -->
  <circle cx="1400" cy="400" r="300" stroke="#06b6d4" stroke-opacity="0.015" stroke-width="0.8" fill="none"/>
  <circle cx="1400" cy="400" r="450" stroke="#0891b2" stroke-opacity="0.01" stroke-width="0.5" fill="none"/>
  <circle cx="400" cy="450" r="250" stroke="#10b981" stroke-opacity="0.012" stroke-width="0.6" fill="none"/>
  <circle cx="400" cy="450" r="380" stroke="#059669" stroke-opacity="0.008" stroke-width="0.4" fill="none"/>

  <!-- Noise texture -->
  <rect width="1920" height="800" fill="transparent" filter="url(#a2-noise)" opacity="0.35"/>
</svg>