<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 540" fill="none">
  <defs>
    <linearGradient id="c2-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#1a1a28"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="450" height="540" fill="url(#c2-bg)"/>

  <!-- Overlapping large circles at very low opacity -->
  <circle cx="150" cy="180" r="140" fill="#8b5cf6" opacity="0.05"/>
  <circle cx="320" cy="250" r="160" fill="#06b6d4" opacity="0.06"/>
  <circle cx="200" cy="400" r="130" fill="#7c3aed" opacity="0.04"/>
  <circle cx="380" cy="120" r="110" fill="#3b82f6" opacity="0.05"/>
  <circle cx="80" cy="350" r="120" fill="#06b6d4" opacity="0.04"/>
  <circle cx="300" cy="450" r="100" fill="#8b5cf6" opacity="0.07"/>

  <!-- Circle outlines for depth -->
  <circle cx="150" cy="180" r="140" stroke="#8b5cf6" stroke-width="0.5" fill="none" opacity="0.06"/>
  <circle cx="320" cy="250" r="160" stroke="#06b6d4" stroke-width="0.5" fill="none" opacity="0.05"/>
  <circle cx="200" cy="400" r="130" stroke="#7c3aed" stroke-width="0.3" fill="none" opacity="0.04"/>

  <!-- Subtle diagonal line pattern at 2% opacity -->
  <g opacity="0.02" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="0" x2="450" y2="450"/>
    <line x1="50" y1="0" x2="450" y2="400"/>
    <line x1="100" y1="0" x2="450" y2="350"/>
    <line x1="150" y1="0" x2="450" y2="300"/>
    <line x1="200" y1="0" x2="450" y2="250"/>
    <line x1="250" y1="0" x2="450" y2="200"/>
    <line x1="300" y1="0" x2="450" y2="150"/>
    <line x1="0" y1="50" x2="400" y2="450"/>
    <line x1="0" y1="100" x2="350" y2="450"/>
    <line x1="0" y1="150" x2="300" y2="450"/>
    <line x1="0" y1="200" x2="250" y2="450"/>
    <line x1="0" y1="250" x2="200" y2="450"/>
    <line x1="0" y1="300" x2="150" y2="450"/>
    <line x1="0" y1="350" x2="100" y2="450"/>
    <line x1="0" y1="450" x2="450" y2="540"/>
    <line x1="0" y1="490" x2="300" y2="540"/>
  </g>
</svg>