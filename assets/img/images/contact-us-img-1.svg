  <circle cx="440" cy="480" r="2" fill="#a1a1aa" opacity="0.07"/>
  <circle cx="850" cy="520" r="2.5" fill="#d4d4d8" opacity="0.08"/>
  <circle cx="1200" cy="560" r="2" fill="#a1a1aa" opacity="0.09"/>
  <circle cx="1580" cy="510" r="1.8" fill="#d4d4d8" opacity="0.07"/>
  <circle cx="200" cy="400" r="2.2" fill="#a1a1aa" opacity="0.08"/>
  <circle cx="1750" cy="150" r="2" fill="#a1a1aa" opacity="0.06"/>
  <circle cx="670" cy="600" r="2.2" fill="#d4d4d8" opacity="0.06"/>
  <circle cx="1420" cy="130" r="1.8" fill="#a1a1aa" opacity="0.07"/>

