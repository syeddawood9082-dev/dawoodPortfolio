  <line x1="440" y1="480" x2="850" y2="520" stroke="#71717a" stroke-opacity="0.04" stroke-width="0.4"/>
  <line x1="850" y1="520" x2="1200" y2="560" stroke="#71717a" stroke-opacity="0.04" stroke-width="0.4"/>
  <line x1="1200" y1="560" x2="1580" y2="510" stroke="#71717a" stroke-opacity="0.035" stroke-width="0.4"/>
  <line x1="960" y1="380" x2="850" y2="520" stroke="#71717a" stroke-opacity="0.03" stroke-width="0.3"/>
  <line x1="1340" y1="420" x2="1200" y2="560" stroke="#71717a" stroke-opacity="0.03" stroke-width="0.3"/>
  <line x1="200" y1="400" x2="320" y2="180" stroke="#71717a" stroke-opacity="0.03" stroke-width="0.3"/>
  <line x1="200" y1="400" x2="440" y2="480" stroke="#71717a" stroke-opacity="0.035" stroke-width="0.3"/>
  <line x1="1680" y1="340" x2="1750" y2="150" stroke="#71717a" stroke-opacity="0.03" stroke-width="0.3"/>
  <line x1="1580" y1="510" x2="1680" y2="340" stroke="#71717a" stroke-opacity="0.03" stroke-width="0.3"/>
