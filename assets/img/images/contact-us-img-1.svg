<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 730" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base gradient -->
    <linearGradient id="c1-base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#0f0f12"/>
      <stop offset="30%" stop-color="#131318"/>
      <stop offset="60%" stop-color="#171722"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <!-- Reverse overlay gradient -->
    <linearGradient id="c1-overlay" x1="1" y1="0" x2="0.2" y2="0.9">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f0f12" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Central warm amber glow -->
    <radialGradient id="c1-amber" cx="50%" cy="48%" r="35%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.05"/>
      <stop offset="25%" stop-color="#d97706" stop-opacity="0.035"/>
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <!-- Secondary warm glow -->
    <radialGradient id="c1-warm2" cx="60%" cy="40%" r="25%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle purple atmospheric glow -->
    <radialGradient id="c1-atmos" cx="30%" cy="60%" r="30%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c1-atmos2" cx="78%" cy="35%" r="25%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="1920" height="730" fill="url(#c1-base)"/>
  <rect width="1920" height="730" fill="url(#c1-overlay)"/>

  <!-- Atmospheric glows -->
  <rect width="1920" height="730" fill="url(#c1-amber)"/>
  <rect width="1920" height="730" fill="url(#c1-warm2)"/>
  <rect width="1920" height="730" fill="url(#c1-atmos)"/>
  <rect width="1920" height="730" fill="url(#c1-atmos2)"/>

  <!-- Topographic/contour lines - flowing wavy horizontals -->
  <path d="M0,80 Q240,60 480,85 Q720,110 960,75 Q1200,40 1440,80 Q1680,120 1920,70" stroke="#3f3f46" stroke-opacity="0.08" stroke-width="0.8" fill="none"/>
  <path d="M0,130 Q280,150 560,125 Q840,100 1120,140 Q1400,180 1680,120 Q1800,100 1920,130" stroke="#3f3f46" stroke-opacity="0.06" stroke-width="0.7" fill="none"/>
