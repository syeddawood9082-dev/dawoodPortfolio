  <path d="M0,570 Q300,590 600,560 Q900,530 1200,575 Q1500,620 1800,560 Q1860,550 1920,570" stroke="#3f3f46" stroke-opacity="0.06" stroke-width="0.7" fill="none"/>
  <path d="M0,630 Q280,610 560,640 Q840,670 1120,625 Q1400,580 1680,640 Q1800,660 1920,635" stroke="#3f3f46" stroke-opacity="0.04" stroke-width="0.6" fill="none"/>
  <path d="M0,690 Q350,710 700,685 Q1050,660 1400,700 Q1660,720 1920,690" stroke="#3f3f46" stroke-opacity="0.05" stroke-width="0.5" fill="none"/>

