<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 727" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Very dark base gradient -->
    <linearGradient id="fb-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0c11"/>
      <stop offset="40%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <!-- Horizontal variation -->
    <linearGradient id="fb-horiz" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#0b0b10" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0d0d13" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Warm radial glow for CTA area (center top) -->
    <radialGradient id="fb-warm" cx="50%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.04"/>
      <stop offset="25%" stop-color="#d97706" stop-opacity="0.025"/>
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.012"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <!-- Secondary softer glow -->
    <radialGradient id="fb-warm2" cx="55%" cy="15%" r="25%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <!-- Very faint purple accent -->
    <radialGradient id="fb-accent" cx="35%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <!-- Fine grid pattern -->
    <pattern id="fb-grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="60" y1="0" x2="60" y2="60" stroke="#27272a" stroke-width="0.3" stroke-opacity="0.02"/>
      <line x1="0" y1="60" x2="60" y2="60" stroke="#27272a" stroke-width="0.3" stroke-opacity="0.02"/>
    </pattern>
    <!-- Secondary larger grid -->
    <pattern id="fb-grid2" x="0" y="0" width="240" height="240" patternUnits="userSpaceOnUse">
      <line x1="240" y1="0" x2="240" y2="240" stroke="#3f3f46" stroke-width="0.3" stroke-opacity="0.015"/>
      <line x1="0" y1="240" x2="240" y2="240" stroke="#3f3f46" stroke-width="0.3" stroke-opacity="0.015"/>
    </pattern>
  </defs>

  <!-- Very dark base -->
  <rect width="1920" height="727" fill="url(#fb-base)"/>
  <rect width="1920" height="727" fill="url(#fb-horiz)"/>

  <!-- Subtle warm glow in CTA area -->
  <rect width="1920" height="727" fill="url(#fb-warm)"/>
  <rect width="1920" height="727" fill="url(#fb-warm2)"/>
  <rect width="1920" height="727" fill="url(#fb-accent)"/>

  <!-- Fine grid texture -->
  <rect width="1920" height="727" fill="url(#fb-grid)"/>
  <rect width="1920" height="727" fill="url(#fb-grid2)"/>

  <!-- Very subtle horizontal separation line at the top -->
  <line x1="0" y1="1" x2="1920" y2="1" stroke="#27272a" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Extremely faint atmospheric curves for depth -->
  <path d="M0,300 Q480,280 960,310 Q1440,340 1920,290" stroke="#27272a" stroke-opacity="0.02" stroke-width="0.5" fill="none"/>
  <path d="M0,500 Q480,520 960,490 Q1440,460 1920,510" stroke="#27272a" stroke-opacity="0.015" stroke-width="0.4" fill="none"/>
</svg>