<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b69"/>
      <stop offset="100%" style="stop-color:#e74c3c"/>
    </linearGradient>
    <linearGradient id="perf3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#ffd93d;stop-opacity:0.4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="12" fill="url(#bg3)"/>

  <!-- Subtle hex pattern -->
  <g opacity="0.04" stroke="#ffd93d" stroke-width="1" fill="none">
    <polygon points="400,80 430,97 430,131 400,148 370,131 370,97"/>
    <polygon points="460,80 490,97 490,131 460,148 430,131 430,97"/>
    <polygon points="340,80 370,97 370,131 340,148 310,131 310,97"/>
    <polygon points="430,131 460,148 460,182 430,199 400,182 400,148"/>
    <polygon points="370,131 400,148 400,182 370,199 340,182 340,148"/>
    <polygon points="490,131 520,148 520,182 490,199 460,182 460,148"/>
    <polygon points="310,131 340,148 340,182 310,199 280,182 280,148"/>
  </g>

  <!-- JVM Stack visualization -->
  <g transform="translate(400, 210)">
    <!-- Stack frame container -->
    <rect x="-120" y="-100" width="240" height="200" rx="8" fill="#1a0f3d" opacity="0.6" stroke="#ff6b6b" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Stack header -->
    <rect x="-120" y="-100" width="240" height="30" rx="8" fill="#2d1b69" opacity="0.8"/>
    <text x="0" y="-80" font-family="'Courier New', monospace" font-size="11" fill="#ffd93d" text-anchor="middle" letter-spacing="1">JVM STACK</text>

    <!-- Stack layers (memory blocks) -->
    <rect x="-100" y="-60" width="200" height="24" rx="3" fill="#ff6b6b" opacity="0.25" stroke="#ff6b6b" stroke-width="0.5" stroke-opacity="0.5"/>
    <text x="-90" y="-43" font-family="'Courier New', monospace" font-size="10" fill="#ff9f9f">Heap: 2048MB</text>
    <rect x="40" y="-55" width="50" height="14" rx="7" fill="#ff6b6b" opacity="0.3"/>
    <text x="65" y="-45" font-family="'Courier New', monospace" font-size="8" fill="#ffd93d" text-anchor="middle">92%</text>

    <rect x="-100" y="-30" width="200" height="24" rx="3" fill="#ffd93d" opacity="0.15" stroke="#ffd93d" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="-90" y="-13" font-family="'Courier New', monospace" font-size="10" fill="#ffd993">Metaspace: 512MB</text>

    <rect x="-100" y="0" width="200" height="24" rx="3" fill="#ff6b6b" opacity="0.15" stroke="#ff6b6b" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="-90" y="17" font-family="'Courier New', monospace" font-size="10" fill="#ff9f9f">Thread Stack: 1MB</text>

    <rect x="-100" y="30" width="200" height="24" rx="3" fill="#ffd93d" opacity="0.1" stroke="#ffd93d" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="-90" y="47" font-family="'Courier New', monospace" font-size="10" fill="#ffd993">GC: G1GC</text>
    <rect x="40" y="35" width="50" height="14" rx="7" fill="#6bcb77" opacity="0.3"/>
    <text x="65" y="45" font-family="'Courier New', monospace" font-size="8" fill="#6bcb77" text-anchor="middle">OPT</text>

    <!-- Performance gauge -->
    <g transform="translate(0, 80)">
      <rect x="-80" y="0" width="160" height="8" rx="4" fill="#1a0f3d" opacity="0.8"/>
      <rect x="-80" y="0" width="130" height="8" rx="4" fill="url(#perf3)"/>
      <text x="90" y="8" font-family="'Courier New', monospace" font-size="9" fill="#ffd93d">85%</text>
    </g>
  </g>

  <!-- Performance arrows (upward) -->
  <g opacity="0.2" fill="#6bcb77">
    <polygon points="620,180 630,160 640,180 635,180 635,210 625,210 625,180"/>
    <polygon points="660,200 670,180 680,200 675,200 675,230 665,230 665,200"/>
    <polygon points="700,170 710,150 720,170 715,170 715,200 705,200 705,170"/>
  </g>

  <!-- Decorative corners -->
  <rect x="30" y="30" width="60" height="2" rx="1" fill="#ff6b6b" opacity="0.3"/>
  <rect x="30" y="30" width="2" height="60" rx="1" fill="#ff6b6b" opacity="0.3"/>
  <rect x="710" y="538" width="60" height="2" rx="1" fill="#ff6b6b" opacity="0.3"/>
  <rect x="768" y="480" width="2" height="60" rx="1" fill="#ff6b6b" opacity="0.3"/>

  <!-- Title -->
  <text x="400" y="430" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">JVM Optimization</text>
  <text x="400" y="465" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#fca5a5" text-anchor="middle" letter-spacing="2">FOR AI/ML SYSTEMS</text>

  <!-- Category pill -->
  <rect x="335" y="480" width="130" height="30" rx="15" fill="#ff6b6b" opacity="0.15" stroke="#ff6b6b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="400" y="500" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#fca5a5" text-anchor="middle" letter-spacing="1.5">RESEARCH PAPER</text>
</svg>