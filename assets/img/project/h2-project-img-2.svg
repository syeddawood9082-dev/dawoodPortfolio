<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3443"/>
      <stop offset="100%" style="stop-color:#1a6b4a"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#34e89e;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#34e89e;stop-opacity:0.2"/>
    </linearGradient>
    <linearGradient id="line2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34e89e;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0fd68c;stop-opacity:0.4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="12" fill="url(#bg2)"/>

  <!-- Subtle dot pattern -->
  <g opacity="0.05" fill="#34e89e">
    <circle cx="50" cy="50" r="2"/><circle cx="100" cy="50" r="2"/><circle cx="150" cy="50" r="2"/><circle cx="200" cy="50" r="2"/><circle cx="250" cy="50" r="2"/><circle cx="300" cy="50" r="2"/><circle cx="350" cy="50" r="2"/><circle cx="400" cy="50" r="2"/><circle cx="450" cy="50" r="2"/><circle cx="500" cy="50" r="2"/><circle cx="550" cy="50" r="2"/><circle cx="600" cy="50" r="2"/><circle cx="650" cy="50" r="2"/><circle cx="700" cy="50" r="2"/><circle cx="750" cy="50" r="2"/>
    <circle cx="50" cy="100" r="2"/><circle cx="100" cy="100" r="2"/><circle cx="150" cy="100" r="2"/><circle cx="200" cy="100" r="2"/><circle cx="250" cy="100" r="2"/><circle cx="300" cy="100" r="2"/><circle cx="350" cy="100" r="2"/><circle cx="400" cy="100" r="2"/><circle cx="450" cy="100" r="2"/><circle cx="500" cy="100" r="2"/><circle cx="550" cy="100" r="2"/><circle cx="600" cy="100" r="2"/><circle cx="650" cy="100" r="2"/><circle cx="700" cy="100" r="2"/><circle cx="750" cy="100" r="2"/>
    <circle cx="50" cy="150" r="2"/><circle cx="100" cy="150" r="2"/><circle cx="150" cy="150" r="2"/><circle cx="200" cy="150" r="2"/><circle cx="250" cy="150" r="2"/><circle cx="300" cy="150" r="2"/><circle cx="350" cy="150" r="2"/><circle cx="400" cy="150" r="2"/><circle cx="450" cy="150" r="2"/><circle cx="500" cy="150" r="2"/><circle cx="550" cy="150" r="2"/><circle cx="600" cy="150" r="2"/><circle cx="650" cy="150" r="2"/><circle cx="700" cy="150" r="2"/><circle cx="750" cy="150" r="2"/>
  </g>

  <!-- Chart area background -->
  <rect x="160" y="100" width="480" height="260" rx="8" fill="#0a2a35" opacity="0.5" stroke="#34e89e" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Grid lines -->
  <g stroke="#34e89e" stroke-width="0.5" opacity="0.1">
    <line x1="160" y1="160" x2="640" y2="160"/>
    <line x1="160" y1="220" x2="640" y2="220"/>
    <line x1="160" y1="280" x2="640" y2="280"/>
    <line x1="160" y1="340" x2="640" y2="340"/>
  </g>

  <!-- Bar chart -->
  <g opacity="0.8">
    <rect x="200" y="240" width="35" height="120" rx="3" fill="url(#bar2)"/>
    <rect x="260" y="200" width="35" height="160" rx="3" fill="url(#bar2)"/>
    <rect x="320" y="170" width="35" height="190" rx="3" fill="url(#bar2)"/>
    <rect x="380" y="220" width="35" height="140" rx="3" fill="url(#bar2)"/>
    <rect x="440" y="150" width="35" height="210" rx="3" fill="url(#bar2)"/>
    <rect x="500" y="130" width="35" height="230" rx="3" fill="url(#bar2)"/>
    <rect x="560" y="160" width="35" height="200" rx="3" fill="url(#bar2)"/>
  </g>

  <!-- Trend line -->
  <polyline points="217,235 277,195 337,165 397,215 457,145 517,125 577,155" fill="none" stroke="#34e89e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Data points on trend line -->
  <g fill="#34e89e">
    <circle cx="217" cy="235" r="4" opacity="0.9"/>
    <circle cx="277" cy="195" r="4" opacity="0.9"/>
    <circle cx="337" cy="165" r="4" opacity="0.9"/>
    <circle cx="397" cy="215" r="4" opacity="0.9"/>
    <circle cx="457" cy="145" r="4" opacity="0.9"/>
    <circle cx="517" cy="125" r="5" opacity="0.9"/>
    <circle cx="577" cy="155" r="4" opacity="0.9"/>
  </g>

  <!-- Prediction dashed extension -->
  <line x1="577" y1="155" x2="640" y2="120" stroke="#34e89e" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
  <circle cx="640" cy="120" r="4" fill="none" stroke="#34e89e" stroke-width="1.5" opacity="0.5"/>

  <!-- Decorative corners -->
  <rect x="30" y="30" width="60" height="2" rx="1" fill="#34e89e" opacity="0.3"/>
  <rect x="30" y="30" width="2" height="60" rx="1" fill="#34e89e" opacity="0.3"/>
  <rect x="710" y="538" width="60" height="2" rx="1" fill="#34e89e" opacity="0.3"/>
  <rect x="768" y="480" width="2" height="60" rx="1" fill="#34e89e" opacity="0.3"/>

  <!-- Title -->
  <text x="400" y="430" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">Predictive Analytics</text>
  <text x="400" y="465" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#86efac" text-anchor="middle" letter-spacing="2">NATIONAL BUDGETING</text>

  <!-- Category pill -->
  <rect x="335" y="480" width="130" height="30" rx="15" fill="#34e89e" opacity="0.15" stroke="#34e89e" stroke-width="1" stroke-opacity="0.3"/>
  <text x="400" y="500" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#86efac" text-anchor="middle" letter-spacing="1.5">RESEARCH PAPER</text>
</svg>