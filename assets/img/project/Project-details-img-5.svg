<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <defs>
    <linearGradient id="pd5-bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#1a1828"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="200" fill="url(#pd5-bg)"/>

  <!-- Document/publication icon, centered, ~60px wide -->
  <g transform="translate(150, 95)">
    <!-- Document body with folded corner -->
    <path d="M-22,-35 L-22,35 L22,35 L22,-20 L7,-35 Z"
          stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.40" stroke-linejoin="round"/>
    <!-- Fold -->
    <path d="M7,-35 L7,-20 L22,-20"
          stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.30" stroke-linejoin="round"/>
    <!-- Text lines -->
    <line x1="-12" y1="-10" x2="12" y2="-10" stroke="#8b5cf6" stroke-width="1" opacity="0.20"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#8b5cf6" stroke-width="1" opacity="0.20"/>
    <line x1="-12" y1="10" x2="8" y2="10" stroke="#8b5cf6" stroke-width="1" opacity="0.20"/>
    <line x1="-12" y1="20" x2="12" y2="20" stroke="#8b5cf6" stroke-width="1" opacity="0.20"/>
  </g>
</svg>