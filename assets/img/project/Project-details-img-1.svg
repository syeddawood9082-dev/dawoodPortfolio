<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 945 700" fill="none">
  <defs>
    <linearGradient id="pd1-bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <radialGradient id="pd1-lens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="945" height="700" fill="url(#pd1-bg)"/>

  <!-- Central lens circle -->
  <g transform="translate(472.5, 350)">
    <!-- Large glow -->
    <circle cx="0" cy="0" r="200" fill="url(#pd1-lens)"/>

    <!-- Concentric rings at low opacity -->
    <circle cx="0" cy="0" r="200" stroke="#8b5cf6" stroke-width="0.5" fill="none" opacity="0.06"/>
    <circle cx="0" cy="0" r="170" stroke="#7c3aed" stroke-width="0.5" fill="none" opacity="0.08"/>
    <circle cx="0" cy="0" r="140" stroke="#3b82f6" stroke-width="0.5" fill="none" opacity="0.10"/>
    <circle cx="0" cy="0" r="110" stroke="#3b82f6" stroke-width="0.5" fill="none" opacity="0.06" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="80" stroke="#8b5cf6" stroke-width="0.8" fill="none" opacity="0.12"/>

    <!-- Data scatter plot dots inside the lens (varying sizes) -->
    <circle cx="-50" cy="-30" r="5" fill="#8b5cf6" opacity="0.15"/>
    <circle cx="-30" cy="40" r="3" fill="#3b82f6" opacity="0.12"/>
    <circle cx="20" cy="-50" r="7" fill="#8b5cf6" opacity="0.10"/>
    <circle cx="55" cy="20" r="4" fill="#3b82f6" opacity="0.15"/>
    <circle cx="-15" cy="-65" r="3.5" fill="#7c3aed" opacity="0.12"/>
    <circle cx="40" cy="-25" r="6" fill="#8b5cf6" opacity="0.08"/>
    <circle cx="-60" cy="15" r="4.5" fill="#3b82f6" opacity="0.12"/>
    <circle cx="10" cy="55" r="5" fill="#7c3aed" opacity="0.10"/>
    <circle cx="-35" cy="-55" r="3" fill="#3b82f6" opacity="0.14"/>
    <circle cx="60" cy="-45" r="4" fill="#8b5cf6" opacity="0.10"/>
    <circle cx="-20" cy="20" r="8" fill="#7c3aed" opacity="0.06"/>
    <circle cx="30" cy="40" r="3.5" fill="#3b82f6" opacity="0.12"/>
    <circle cx="-55" cy="-50" r="2.5" fill="#8b5cf6" opacity="0.14"/>
    <circle cx="50" cy="55" r="5.5" fill="#7c3aed" opacity="0.08"/>
    <circle cx="-10" cy="-10" r="4" fill="#3b82f6" opacity="0.10"/>
    <circle cx="0" cy="0" r="2" fill="#8b5cf6" opacity="0.20"/>

    <!-- Radiating analysis lines outside the main circle -->
    <line x1="140" y1="0" x2="220" y2="0" stroke="#8b5cf6" stroke-width="0.5" opacity="0.08"/>
    <line x1="-140" y1="0" x2="-220" y2="0" stroke="#8b5cf6" stroke-width="0.5" opacity="0.08"/>
    <line x1="0" y1="-140" x2="0" y2="-220" stroke="#3b82f6" stroke-width="0.5" opacity="0.08"/>
    <line x1="0" y1="140" x2="0" y2="220" stroke="#3b82f6" stroke-width="0.5" opacity="0.08"/>
    <line x1="99" y1="-99" x2="156" y2="-156" stroke="#7c3aed" stroke-width="0.5" opacity="0.06"/>
    <line x1="-99" y1="99" x2="-156" y2="156" stroke="#7c3aed" stroke-width="0.5" opacity="0.06"/>
    <line x1="99" y1="99" x2="156" y2="156" stroke="#8b5cf6" stroke-width="0.5" opacity="0.06"/>
    <line x1="-99" y1="-99" x2="-156" y2="-156" stroke="#8b5cf6" stroke-width="0.5" opacity="0.06"/>

    <!-- Small tick marks at end of radiating lines -->
    <circle cx="220" cy="0" r="2" fill="#8b5cf6" opacity="0.10"/>
    <circle cx="-220" cy="0" r="2" fill="#8b5cf6" opacity="0.10"/>
    <circle cx="0" cy="-220" r="2" fill="#3b82f6" opacity="0.10"/>
    <circle cx="0" cy="220" r="2" fill="#3b82f6" opacity="0.10"/>
  </g>
</svg>