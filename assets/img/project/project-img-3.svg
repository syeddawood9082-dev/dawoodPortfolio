<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c2461"/>
      <stop offset="100%" style="stop-color:#4834d4"/>
    </linearGradient>
    <linearGradient id="pulse4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="12" fill="url(#bg4)"/>

  <!-- Subtle radial glow -->
  <circle cx="400" cy="250" r="250" fill="#4834d4" opacity="0.15"/>

  <!-- Dashboard container -->
  <rect x="130" y="80" width="540" height="320" rx="10" fill="#0a1744" opacity="0.6" stroke="#3a7bd5" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Dashboard header bar -->
  <rect x="130" y="80" width="540" height="35" rx="10" fill="#0d1f5e" opacity="0.8"/>
  <circle cx="155" cy="97" r="5" fill="#ff6b6b" opacity="0.7"/>
  <circle cx="175" cy="97" r="5" fill="#ffd93d" opacity="0.7"/>
  <circle cx="195" cy="97" r="5" fill="#6bcb77" opacity="0.7"/>
  <text x="400" y="103" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" letter-spacing="1">REAL-TIME DASHBOARD</text>

  <!-- Real-time waveform / streaming line -->
  <polyline points="150,200 175,195 200,210 225,190 250,205 275,185 300,195 325,180 350,200 375,175 400,190 425,170 450,195 475,165 500,180 525,160 550,185 575,155 600,175 625,150 650,170" fill="none" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Streaming area fill -->
  <polygon points="150,200 175,195 200,210 225,190 250,205 275,185 300,195 325,180 350,200 375,175 400,190 425,170 450,195 475,165 500,180 525,160 550,185 575,155 600,175 625,150 650,170 650,280 150,280" fill="#00d2ff" opacity="0.06"/>

  <!-- Mini metric cards -->
  <g>
    <!-- Card 1 -->
    <rect x="160" y="250" width="140" height="65" rx="6" fill="#0d1f5e" opacity="0.7" stroke="#3a7bd5" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="180" y="272" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#64748b" letter-spacing="1">THROUGHPUT</text>
    <text x="180" y="300" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#00d2ff">12.4K</text>
    <text x="260" y="300" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#6bcb77">+18%</text>

    <!-- Card 2 -->
    <rect x="320" y="250" width="140" height="65" rx="6" fill="#0d1f5e" opacity="0.7" stroke="#3a7bd5" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="340" y="272" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#64748b" letter-spacing="1">LATENCY</text>
    <text x="340" y="300" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#00d2ff">23ms</text>
    <text x="405" y="300" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#6bcb77">-8%</text>

    <!-- Card 3 -->
    <rect x="480" y="250" width="140" height="65" rx="6" fill="#0d1f5e" opacity="0.7" stroke="#3a7bd5" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="500" y="272" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#64748b" letter-spacing="1">ACCURACY</text>
    <text x="500" y="300" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#00d2ff">99.7%</text>
  </g>

  <!-- Mini bar charts in dashboard -->
  <g opacity="0.4">
    <rect x="160" y="340" width="8" height="30" rx="2" fill="#3a7bd5"/>
    <rect x="175" y="350" width="8" height="20" rx="2" fill="#3a7bd5"/>
    <rect x="190" y="335" width="8" height="35" rx="2" fill="#00d2ff"/>
    <rect x="205" y="345" width="8" height="25" rx="2" fill="#3a7bd5"/>
    <rect x="220" y="330" width="8" height="40" rx="2" fill="#3a7bd5"/>
    <rect x="235" y="340" width="8" height="30" rx="2" fill="#3a7bd5"/>
    <rect x="250" y="325" width="8" height="45" rx="2" fill="#00d2ff"/>
  </g>

  <!-- Streaming dot indicator -->
  <circle cx="650" cy="170" r="5" fill="#00d2ff" opacity="0.9"/>
  <circle cx="650" cy="170" r="10" fill="none" stroke="#00d2ff" stroke-width="1" opacity="0.4"/>
  <circle cx="650" cy="170" r="16" fill="none" stroke="#00d2ff" stroke-width="0.5" opacity="0.2"/>

  <!-- Decorative corners -->
  <rect x="30" y="30" width="60" height="2" rx="1" fill="#00d2ff" opacity="0.3"/>
  <rect x="30" y="30" width="2" height="60" rx="1" fill="#00d2ff" opacity="0.3"/>
  <rect x="710" y="538" width="60" height="2" rx="1" fill="#00d2ff" opacity="0.3"/>
  <rect x="768" y="480" width="2" height="60" rx="1" fill="#00d2ff" opacity="0.3"/>

  <!-- Title -->
  <text x="400" y="440" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">Real-Time Analytics</text>
  <text x="400" y="475" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#7dd3fc" text-anchor="middle" letter-spacing="2">ENGINE FOR GOVERNANCE</text>

  <!-- Category pill -->
  <rect x="335" y="492" width="130" height="30" rx="15" fill="#00d2ff" opacity="0.15" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="400" y="512" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="middle" letter-spacing="1.5">RESEARCH PAPER</text>
</svg>