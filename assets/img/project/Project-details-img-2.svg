<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 945 700" fill="none">
  <defs>
    <linearGradient id="pd2-bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#161630"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="945" height="700" fill="url(#pd2-bg)"/>

  <!-- === AI Architecture: 3 stacked horizontal layers === -->
  <g transform="translate(472.5, 350)">

    <!-- Layer 1 (top) - Input Layer -->
    <rect x="-200" y="-180" width="400" height="80" rx="12" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.20"/>
    <rect x="-200" y="-180" width="400" height="80" rx="12" fill="#3b82f6" opacity="0.02"/>
    <!-- Nodes inside layer 1 -->
    <circle cx="-120" cy="-140" r="8" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.25"/>
    <circle cx="-60" cy="-140" r="8" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.25"/>
    <circle cx="0" cy="-140" r="8" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.25"/>
    <circle cx="60" cy="-140" r="8" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.25"/>
    <circle cx="120" cy="-140" r="8" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.25"/>

    <!-- Layer 2 (middle) - Hidden Layer -->
    <rect x="-180" y="-40" width="360" height="80" rx="12" stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.25"/>
    <rect x="-180" y="-40" width="360" height="80" rx="12" fill="#06b6d4" opacity="0.02"/>
    <!-- Nodes inside layer 2 -->
    <circle cx="-100" cy="0" r="8" stroke="#06b6d4" stroke-width="1" fill="none" opacity="0.30"/>
    <circle cx="-40" cy="0" r="8" stroke="#06b6d4" stroke-width="1" fill="none" opacity="0.30"/>
    <circle cx="20" cy="0" r="8" stroke="#06b6d4" stroke-width="1" fill="none" opacity="0.30"/>
    <circle cx="80" cy="0" r="8" stroke="#06b6d4" stroke-width="1" fill="none" opacity="0.30"/>

    <!-- Layer 3 (bottom) - Output Layer -->
    <rect x="-150" y="100" width="300" height="80" rx="12" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.20"/>
    <rect x="-150" y="100" width="300" height="80" rx="12" fill="#3b82f6" opacity="0.02"/>
    <!-- Nodes inside layer 3 -->
    <circle cx="-60" cy="140" r="8" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.25"/>
    <circle cx="0" cy="140" r="8" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.25"/>
    <circle cx="60" cy="140" r="8" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.25"/>

    <!-- Vertical connection lines between layers -->
    <!-- Layer 1 to Layer 2 connections (selected, not all) -->
    <line x1="-120" y1="-132" x2="-100" y2="-8" stroke="#3b82f6" stroke-width="0.5" opacity="0.08"/>
    <line x1="-120" y1="-132" x2="-40" y2="-8" stroke="#3b82f6" stroke-width="0.3" opacity="0.05"/>
    <line x1="-60" y1="-132" x2="-100" y2="-8" stroke="#06b6d4" stroke-width="0.3" opacity="0.05"/>
    <line x1="-60" y1="-132" x2="-40" y2="-8" stroke="#06b6d4" stroke-width="0.5" opacity="0.08"/>
    <line x1="0" y1="-132" x2="20" y2="-8" stroke="#3b82f6" stroke-width="0.5" opacity="0.08"/>
    <line x1="0" y1="-132" x2="-40" y2="-8" stroke="#3b82f6" stroke-width="0.3" opacity="0.05"/>
    <line x1="60" y1="-132" x2="20" y2="-8" stroke="#06b6d4" stroke-width="0.5" opacity="0.08"/>
    <line x1="60" y1="-132" x2="80" y2="-8" stroke="#06b6d4" stroke-width="0.5" opacity="0.08"/>
    <line x1="120" y1="-132" x2="80" y2="-8" stroke="#3b82f6" stroke-width="0.5" opacity="0.08"/>
    <line x1="120" y1="-132" x2="20" y2="-8" stroke="#3b82f6" stroke-width="0.3" opacity="0.05"/>

    <!-- Layer 2 to Layer 3 connections -->
    <line x1="-100" y1="8" x2="-60" y2="132" stroke="#06b6d4" stroke-width="0.5" opacity="0.08"/>
    <line x1="-100" y1="8" x2="0" y2="132" stroke="#06b6d4" stroke-width="0.3" opacity="0.05"/>
    <line x1="-40" y1="8" x2="-60" y2="132" stroke="#3b82f6" stroke-width="0.5" opacity="0.08"/>
    <line x1="-40" y1="8" x2="0" y2="132" stroke="#3b82f6" stroke-width="0.5" opacity="0.08"/>
    <line x1="20" y1="8" x2="0" y2="132" stroke="#06b6d4" stroke-width="0.5" opacity="0.08"/>
    <line x1="20" y1="8" x2="60" y2="132" stroke="#06b6d4" stroke-width="0.5" opacity="0.08"/>
    <line x1="80" y1="8" x2="60" y2="132" stroke="#3b82f6" stroke-width="0.5" opacity="0.08"/>
    <line x1="80" y1="8" x2="0" y2="132" stroke="#3b82f6" stroke-width="0.3" opacity="0.05"/>
  </g>
</svg>