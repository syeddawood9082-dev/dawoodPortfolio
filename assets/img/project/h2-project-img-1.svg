<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="12" fill="url(#bg1)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#e2e8f0" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>

  <!-- Neural network nodes and connections -->
  <g opacity="0.12" stroke="#7c3aed" stroke-width="1">
    <!-- Layer 1 -->
    <circle cx="150" cy="150" r="6" fill="#7c3aed" opacity="0.3"/>
    <circle cx="150" cy="250" r="6" fill="#7c3aed" opacity="0.3"/>
    <circle cx="150" cy="350" r="6" fill="#7c3aed" opacity="0.3"/>
    <circle cx="150" cy="450" r="6" fill="#7c3aed" opacity="0.3"/>
    <!-- Layer 2 -->
    <circle cx="300" cy="180" r="6" fill="#3b82f6" opacity="0.3"/>
    <circle cx="300" cy="300" r="6" fill="#3b82f6" opacity="0.3"/>
    <circle cx="300" cy="420" r="6" fill="#3b82f6" opacity="0.3"/>
    <!-- Layer 3 -->
    <circle cx="450" cy="200" r="6" fill="#7c3aed" opacity="0.3"/>
    <circle cx="450" cy="350" r="6" fill="#7c3aed" opacity="0.3"/>
    <!-- Connections L1-L2 -->
    <line x1="150" y1="150" x2="300" y2="180"/>
    <line x1="150" y1="150" x2="300" y2="300"/>
    <line x1="150" y1="250" x2="300" y2="180"/>
    <line x1="150" y1="250" x2="300" y2="300"/>
    <line x1="150" y1="250" x2="300" y2="420"/>
    <line x1="150" y1="350" x2="300" y2="300"/>
    <line x1="150" y1="350" x2="300" y2="420"/>
    <line x1="150" y1="450" x2="300" y2="420"/>
    <line x1="150" y1="450" x2="300" y2="300"/>
    <!-- Connections L2-L3 -->
    <line x1="300" y1="180" x2="450" y2="200"/>
    <line x1="300" y1="180" x2="450" y2="350"/>
    <line x1="300" y1="300" x2="450" y2="200"/>
    <line x1="300" y1="300" x2="450" y2="350"/>
    <line x1="300" y1="420" x2="450" y2="350"/>
    <line x1="300" y1="420" x2="450" y2="200"/>
  </g>

  <!-- Book icon - centered -->
  <g transform="translate(400, 240)">
    <!-- Book spine glow -->
    <rect x="-75" y="-80" width="150" height="160" rx="6" fill="url(#glow1)" opacity="0.3"/>
    <!-- Book back cover -->
    <rect x="-60" y="-70" width="120" height="140" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <!-- Book front cover -->
    <rect x="-55" y="-75" width="120" height="140" rx="4" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5"/>
    <!-- Book spine -->
    <line x1="-55" y1="-75" x2="-55" y2="65" stroke="#7c3aed" stroke-width="2"/>
    <!-- Page lines -->
    <line x1="-30" y1="-50" x2="45" y2="-50" stroke="#475569" stroke-width="1" opacity="0.6"/>
    <line x1="-30" y1="-35" x2="45" y2="-35" stroke="#475569" stroke-width="1" opacity="0.6"/>
    <line x1="-30" y1="-20" x2="45" y2="-20" stroke="#475569" stroke-width="1" opacity="0.6"/>
    <line x1="-30" y1="-5" x2="30" y2="-5" stroke="#475569" stroke-width="1" opacity="0.6"/>
    <!-- AI brain symbol on cover -->
    <circle cx="5" cy="20" r="18" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.7"/>
    <path d="M-5,12 Q5,5 15,12 M-5,20 Q5,28 15,20 M-2,8 Q5,15 12,8" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Decorative corner elements -->
  <rect x="30" y="30" width="60" height="2" rx="1" fill="#7c3aed" opacity="0.3"/>
  <rect x="30" y="30" width="2" height="60" rx="1" fill="#7c3aed" opacity="0.3"/>
  <rect x="710" y="538" width="60" height="2" rx="1" fill="#7c3aed" opacity="0.3"/>
  <rect x="768" y="480" width="2" height="60" rx="1" fill="#7c3aed" opacity="0.3"/>

  <!-- Title text -->
  <text x="400" y="420" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">Ground Truth</text>
  <text x="400" y="455" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="2">BUILDING RELIABLE AI SYSTEMS</text>

  <!-- Category pill -->
  <rect x="345" y="475" width="110" height="30" rx="15" fill="#7c3aed" opacity="0.2" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.4"/>
  <text x="400" y="495" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#c4b5fd" text-anchor="middle" letter-spacing="1.5">BOOK</text>
</svg>