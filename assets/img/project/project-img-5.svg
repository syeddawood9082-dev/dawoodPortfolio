<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3c34"/>
      <stop offset="100%" style="stop-color:#1a5c3a"/>
    </linearGradient>
    <linearGradient id="stream5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:0.1"/>
      <stop offset="50%" style="stop-color:#2ecc71;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="12" fill="url(#bg5)"/>

  <!-- Subtle circuit pattern -->
  <g opacity="0.05" stroke="#2ecc71" stroke-width="1">
    <path d="M0,300 H200 L220,280 H350 L370,300 H500 L520,280 H800" fill="none"/>
    <path d="M0,320 H180 L200,340 H370 L390,320 H520 L540,340 H800" fill="none"/>
    <path d="M0,280 H100 L120,260 H300 L320,280 H450 L470,260 H800" fill="none"/>
  </g>

  <!-- Kafka pipeline visualization -->
  <g transform="translate(0, -20)">
    <!-- Producer nodes (left) -->
    <g opacity="0.8">
      <rect x="80" y="160" width="100" height="40" rx="6" fill="#143028" stroke="#2ecc71" stroke-width="1" stroke-opacity="0.5"/>
      <text x="130" y="185" font-family="'Courier New', monospace" font-size="10" fill="#2ecc71" text-anchor="middle">Producer 1</text>

      <rect x="80" y="220" width="100" height="40" rx="6" fill="#143028" stroke="#2ecc71" stroke-width="1" stroke-opacity="0.5"/>
      <text x="130" y="245" font-family="'Courier New', monospace" font-size="10" fill="#2ecc71" text-anchor="middle">Producer 2</text>

      <rect x="80" y="280" width="100" height="40" rx="6" fill="#143028" stroke="#2ecc71" stroke-width="1" stroke-opacity="0.5"/>
      <text x="130" y="305" font-family="'Courier New', monospace" font-size="10" fill="#2ecc71" text-anchor="middle">Producer 3</text>
    </g>

    <!-- Stream arrows left -->
    <g opacity="0.5">
      <line x1="180" y1="180" x2="290" y2="230" stroke="#2ecc71" stroke-width="1.5"/>
      <line x1="180" y1="240" x2="290" y2="250" stroke="#2ecc71" stroke-width="1.5"/>
      <line x1="180" y1="300" x2="290" y2="270" stroke="#2ecc71" stroke-width="1.5"/>
    </g>

    <!-- Data stream particles left -->
    <g fill="#2ecc71" opacity="0.6">
      <circle cx="220" cy="210" r="3"/>
      <circle cx="240" cy="244" r="3"/>
      <circle cx="225" cy="280" r="3"/>
    </g>

    <!-- Kafka broker (center) -->
    <rect x="290" y="180" width="220" height="140" rx="10" fill="#0f2620" opacity="0.8" stroke="#2ecc71" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Kafka logo area -->
    <text x="400" y="215" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#2ecc71" text-anchor="middle" letter-spacing="2">APACHE KAFKA</text>

    <!-- Topic partitions -->
    <g>
      <rect x="310" y="230" width="180" height="16" rx="3" fill="#2ecc71" opacity="0.15"/>
      <rect x="310" y="230" width="120" height="16" rx="3" fill="#2ecc71" opacity="0.25"/>
      <text x="320" y="242" font-family="'Courier New', monospace" font-size="9" fill="#6ee7a0">Topic: edi-transactions</text>

      <rect x="310" y="254" width="180" height="16" rx="3" fill="#2ecc71" opacity="0.1"/>
      <rect x="310" y="254" width="90" height="16" rx="3" fill="#2ecc71" opacity="0.2"/>
      <text x="320" y="266" font-family="'Courier New', monospace" font-size="9" fill="#6ee7a0">Partition 0-3</text>

      <rect x="310" y="278" width="180" height="16" rx="3" fill="#2ecc71" opacity="0.08"/>
      <rect x="310" y="278" width="150" height="16" rx="3" fill="#2ecc71" opacity="0.15"/>
      <text x="320" y="290" font-family="'Courier New', monospace" font-size="9" fill="#6ee7a0">Offset: 1,247,832</text>
    </g>

    <!-- Stream arrows right -->
    <g opacity="0.5">
      <line x1="510" y1="230" x2="610" y2="180" stroke="#2ecc71" stroke-width="1.5"/>
      <line x1="510" y1="250" x2="610" y2="240" stroke="#2ecc71" stroke-width="1.5"/>
      <line x1="510" y1="270" x2="610" y2="300" stroke="#2ecc71" stroke-width="1.5"/>
    </g>

    <!-- Data stream particles right -->
    <g fill="#2ecc71" opacity="0.6">
      <circle cx="560" cy="210" r="3"/>
      <circle cx="550" cy="244" r="3"/>
      <circle cx="565" cy="280" r="3"/>
    </g>

    <!-- Consumer nodes (right) -->
    <g opacity="0.8">
      <rect x="610" y="160" width="110" height="40" rx="6" fill="#143028" stroke="#2ecc71" stroke-width="1" stroke-opacity="0.5"/>
      <text x="665" y="185" font-family="'Courier New', monospace" font-size="10" fill="#2ecc71" text-anchor="middle">Consumer 1</text>

      <rect x="610" y="220" width="110" height="40" rx="6" fill="#143028" stroke="#2ecc71" stroke-width="1" stroke-opacity="0.5"/>
      <text x="665" y="245" font-family="'Courier New', monospace" font-size="10" fill="#2ecc71" text-anchor="middle">Consumer 2</text>

      <rect x="610" y="280" width="110" height="40" rx="6" fill="#143028" stroke="#2ecc71" stroke-width="1" stroke-opacity="0.5"/>
      <text x="665" y="305" font-family="'Courier New', monospace" font-size="10" fill="#2ecc71" text-anchor="middle">Consumer 3</text>
    </g>
  </g>

  <!-- Performance badge -->
  <rect x="310" y="340" width="180" height="28" rx="14" fill="#2ecc71" opacity="0.12" stroke="#2ecc71" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="400" y="359" font-family="'Courier New', monospace" font-size="10" fill="#6ee7a0" text-anchor="middle">4h to 25min latency</text>

  <!-- Decorative corners -->
  <rect x="30" y="30" width="60" height="2" rx="1" fill="#2ecc71" opacity="0.3"/>
  <rect x="30" y="30" width="2" height="60" rx="1" fill="#2ecc71" opacity="0.3"/>
  <rect x="710" y="538" width="60" height="2" rx="1" fill="#2ecc71" opacity="0.3"/>
  <rect x="768" y="480" width="2" height="60" rx="1" fill="#2ecc71" opacity="0.3"/>

  <!-- Title -->
  <text x="400" y="430" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">Apache Kafka EDI</text>
  <text x="400" y="465" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#86efac" text-anchor="middle" letter-spacing="2">TRANSACTION REDESIGN</text>

  <!-- Category pill -->
  <rect x="340" y="480" width="120" height="30" rx="15" fill="#2ecc71" opacity="0.15" stroke="#2ecc71" stroke-width="1" stroke-opacity="0.3"/>
  <text x="400" y="500" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#86efac" text-anchor="middle" letter-spacing="1.5">GHX INDIA</text>
</svg>